name: Checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04, alpine:3.22]
    steps:
      - uses: actions/checkout@v4
      - name: Native core and complete TCP/UDP chain
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" sh -ec '
            if command -v apk >/dev/null; then
              apk add --no-cache python3 curl ca-certificates openssl
            else
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 curl ca-certificates openssl
            fi
            sh -n install.sh
            python3 -m unittest discover -s tests -v
            python3 tests/download_core.py
            python3 tests/integration.py .test-core/sing-box
          '
  systemd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/download_core.py
      - name: Real systemd lifecycle in disposable runner
        run: sudo env LINKBOX_DISPOSABLE_CI=1 python3 tests/service_lifecycle.py
